[project]
name = "presentation-grader-backend"
version = "0.1.0"
description = "Grades narrated PPTX presentations (slides + per-slide audio) against a rubric."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "mistralai>=2.10.1",
    "pypdf>=6.18.1",
]

[tool.uv]
package = false
